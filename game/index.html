<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Protocol — Stealth Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d3dfe6; }
  #game { position: fixed; inset: 0; margin: auto; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; box-shadow: 0 0 60px rgba(16, 34, 48, 0.35); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Shadow Protocol: sneak through the facility, collect 3 intel, and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
